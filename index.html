<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b6e77">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>DTI 224 - JS Assignments</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2b6e77 0%, #0f6e56 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 2rem 1rem;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 460px;
    border-radius: 16px;
    padding: 34px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 {
    text-align: center;
    color: #222;
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin: 0 0 26px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .links a {
    display: block;
    text-decoration: none;
    padding: 14px 18px;
    border-radius: 10px;
    background: #f3f2ee;
    color: #1f2933;
    font-weight: 600;
    font-size: 15px;
    border: 1px solid #e0ddd2;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .links a:hover {
    background: #e4eeee;
    transform: translateY(-1px);
  }
  .links a span.desc {
    display: block;
    font-weight: 400;
    font-size: 12.5px;
    color: #777;
    margin-top: 3px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>DTI 224 &mdash; JavaScript Assignments</h1>
  <p class="subtitle">Pick a program to open</p>

  <div class="links">
    <a href="measurement_converter.html">
      Measurement Converter
      <span class="desc">Convert length, height, temperature, and area</span>
    </a>
    <a href="grading-system.html">
      Student Grading System
      <span class="desc">Enter marks to calculate a letter grade</span>
    </a>
    <a href="calculate-change.html">
      Calculate Change
      <span class="desc">Break an amount down into notes and coins</span>
    </a>
    <a href="distance-from-university.html">
      How Far From University?
      <span class="desc">Distance = sqrt(x&sup2; + y&sup2;)</span>
    </a>
  </div>
</div>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registered:', reg.scope))
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
